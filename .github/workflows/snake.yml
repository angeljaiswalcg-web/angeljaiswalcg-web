
name: Generate Purple Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: angeljaiswalcg-web
          outputs: |
            dist/github-snake.svg?color_snake=%23E9D5FF&color_dots=%2310091D,%23321B48,%236D28D9,%23A855F7,%23E9D5FF

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
